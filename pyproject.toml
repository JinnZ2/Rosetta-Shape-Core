[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-shape-core"
version = "0.1.0"
description = "Stable ontology + rules runtime for symbolic Shape - Intelligence - Capability."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.0,<5"]
license = {text = "CC0-1.0"}

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.0"]

[project.scripts]
rosetta-bloom = "rosetta_shape_core.bloom:main"
rosetta-sim = "rosetta_shape_core.sim:main"
rosetta-explore = "rosetta_shape_core.explore:main"
rosetta-expand = "rosetta_shape_core.expand:main"
rosetta-audit = "rosetta_shape_core.self_audit:main"
rosetta-query = "rosetta_shape_core.query:main"
rosetta-agent = "rosetta_shape_core.constraint_agent:main"
rosetta-adaptive-sim = "rosetta_shape_core.adaptive_sim:main"
rosetta-discrepancy = "rosetta_shape_core.discrepancy:main"
rosetta-operator = "rosetta_shape_core.rosetta:main"
rosetta-families = "rosetta_shape_core.families:main"
rosetta-entry = "rosetta_shape_core.entry:main"
rosetta-scope = "rosetta_shape_core.scope:main"
rosetta-gate-log = "rosetta_shape_core.gate_log:main"
rosetta-provenance = "rosetta_shape_core.provenance:main"
rosetta-transfer = "rosetta_shape_core.transfer:main"
rosetta-lid-import = "rosetta_shape_core.lid_import:main"
rosetta-gap-scan = "rosetta_shape_core.gap_scan:main"
rsc-mandala-bridge = "rsc_mandala_bridge.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/JinnZ2/Rosetta-Shape-Core"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
